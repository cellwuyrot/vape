<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#ffffff" />
  <title>Страница не найдена — VAPELAB</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png" />
  <style>
    :root{color-scheme:light;font-family:Inter,Arial,sans-serif;background:#fff;color:#090909}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px}
    main{width:min(100%,680px);text-align:center}img{width:76px;height:76px;object-fit:contain;border-radius:50%;background:#fff;border:1px solid #e9edf2;padding:9px}
    .code{margin:34px 0 8px;color:#246bde;font-size:clamp(76px,16vw,132px);font-weight:800;letter-spacing:-.08em;line-height:.9}
    h1{margin:24px 0 10px;font-size:clamp(26px,5vw,42px);letter-spacing:-.04em}p{color:#667085;line-height:1.65;margin:0 auto;max-width:470px}
    a{display:inline-flex;align-items:center;justify-content:center;gap:10px;margin-top:30px;padding:14px 22px;background:#090909;color:#fff;text-decoration:none;border-radius:999px;font-weight:700;transition:background .2s,transform .2s}
    a:hover{background:#246bde;transform:translateY(-2px)}a:focus-visible{outline:3px solid #38c8e9;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <img src="/assets/brand/vapelab-logo.webp" alt="VAPELAB" />
    <div class="code">404</div>
    <h1>Страница не найдена</h1>
    <p>Возможно, адрес изменился или страница ещё не опубликована. Вернитесь на главную VAPELAB.</p>
    <a href="/">На главную <span aria-hidden="true">↗</span></a>
  </main>
</body>
</html>
