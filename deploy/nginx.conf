# Обратный прокси с HTTPS. Сертификат — certbot или российский УЦ.
server {
    listen 80;
    server_name crm.example.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name crm.example.ru;

    ssl_certificate     /etc/letsencrypt/live/crm.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.ru/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Должно быть не меньше MAX_FILE_SIZE приложения (по умолчанию 25 МБ)
    client_max_body_size 26m;

    # Шрифты и статика кешируются надолго
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Метрики наружу не отдаём: их снимает Prometheus из внутренней сети
    location = /api/metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Инбокс держит длинные запросы (long-poll) — не рвём соединение раньше времени
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
}
